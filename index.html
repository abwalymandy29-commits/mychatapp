<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سوا - دردشة الأصدقاء</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #edf3f0;
  color: #172521;
  font-family: Tahoma, Arial, sans-serif;
}

.app {
  max-width: 720px;
  min-height: 100vh;
  margin: auto;
  background: white;
}

header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px;
  background: #075e54;
  color: white;
}

header h1 {
  margin: 0;
  font-size: 24px;
}

header small {
  display: block;
  margin-top: 4px;
}

.grow {
  flex: 1;
}

.avatar {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: #d7eee5;
  color: #075e54;
  font-size: 20px;
  font-weight: bold;
  overflow: hidden;
}

button {
  padding: 11px 14px;
  border: none;
  border-radius: 10px;
  background: #087e68;
  color: white;
  font-size: 14px;
  cursor: pointer;
}

.secondary {
  background: #e5f2ec;
  color: #075e54;
}

.field {
  width: 100%;
  min-width: 0;
  padding: 12px;
  border: 1px solid #d7e2dc;
  border-radius: 10px;
  font: inherit;
}

section {
  padding: 16px;
}

.stack {
  display: grid;
  gap: 12px;
}

.top {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px;
  background: #f7fbf9;
  border-bottom: 1px solid #e0e9e4;
}

.muted {
  color: #65766f;
  font-size: 12px;
}

#chat {
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-height: 300px;
  max-height: 50vh;
  padding: 14px;
  overflow-y: auto;
  background: #f6faf8;
}

.msg {
  align-self: flex-start;
  max-width: 90%;
  padding: 12px;
  border: 1px solid #e0e9e4;
  border-radius: 13px;
  background: white;
  overflow-wrap: anywhere;
}

.meta {
  margin-bottom: 6px;
  color: #687871;
  font-size: 11px;
}

.msg img {
  display: block;
  max-width: 100%;
  max-height: 250px;
  margin-top: 8px;
  border-radius: 8px;
}

.msg audio {
  max-width: 100%;
  margin-top: 8px;
}

.composer {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  padding: 12px;
  border-top: 1px solid #e0e9e4;
}

.composer .field {
  flex: 1;
  width: auto;
}

.status {
  padding: 10px 14px;
  color: #53655d;
  font-size: 12px;
  line-height: 1.7;
}

.note {
  background: #fffbea;
  color: #695c31;
}

.hidden {
  display: none !important;
}
</style>
</head>

<body>

<main class="app">

<header>
  <div class="avatar">س</div>

  <div class="grow">
    <h1>سوا</h1>
    <small>قريبين ولو بعيد ❤️</small>
  </div>

  <button id="profile" class="secondary">ملفي</button>
</header>

<div class="top">
  <div class="avatar" id="avatar">س</div>

  <div class="grow">
    <b id="name">مستخدم سوا</b>
    <div id="phoneLabel" class="muted">ملفك الشخصي</div>
  </div>

  <button id="edit" class="secondary">تعديل الاسم</button>
</div>

<section id="login" class="stack">

  <h3 style="margin:0">تسجيل الدخول</h3>

  <p class="muted">
    أدخل رقم هاتفك مع مفتاح الدولة للحصول على رمز التحقق.
  </p>

  <input
    id="phone"
    class="field"
    type="tel"
    placeholder="+90XXXXXXXXXX"
  >

  <div id="recaptcha-container"></div>

  <button id="sendCode">إرسال رمز SMS</button>

  <div id="codeArea" class="hidden stack">

    <input
      id="code"
      class="field"
      inputmode="numeric"
      placeholder="أدخل رمز التحقق"
    >

    <button id="verify">تأكيد الرمز</button>

  </div>

  <button id="guest" class="secondary">
    تجربة التطبيق بدون تسجيل
  </button>

</section>

<div id="main" class="hidden">

  <div class="top">

    <input
      id="search"
      class="field"
      placeholder="ابحث في الرسائل"
    >

    <button id="logout" class="secondary">
      خروج
    </button>

  </div>

  <div id="chat">
    <div class="status">
      أهلًا بك في سوا 👋
    </div>
  </div>

  <div class="composer">

    <input
      id="message"
      class="field"
      maxlength="2000"
      placeholder="اكتب رسالتك..."
    >

    <button id="send">إرسال</button>

    <button id="attach" class="secondary">
      📎
    </button>

    <button id="record" class="secondary">
      🎙️
    </button>

    <input
      id="file"
      class="hidden"
      type="file"
      accept="image/*,audio/*,.pdf,.txt"
    >

  </div>

  <div id="recordStatus" class="status"></div>

</div>

<div id="status" class="status">
  تطبيق سوا جاهز.
</div>

<div class="status note">
  هذه نسخة تطوير أولية. يجب إعداد Firebase وتأمين قواعد البيانات
  قبل استخدامها مع أشخاص حقيقيين. المحادثة الحالية مشتركة.
</div>

</main>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  query,
  orderBy,
  limit,
  onSnapshot,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

import {
  getAuth,
  RecaptchaVerifier,
  signInWithPhoneNumber,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

import {
  getStorage,
  ref,
  uploadBytes,
  getDownloadURL
} from "https://www.gstatic.com/firebasejs/11.0.1/firebase-storage.js";

const config = {
  apiKey: "AIzaSyBNySfdNWzKeb2mSxOcuUbEe4f_b1VZph8",
  authDomain: "mychatapp-8bd5a.firebaseapp.com",
  projectId: "mychatapp-8bd5a",
  storageBucket: "mychatapp-8bd5a.firebasestorage.app",
  messagingSenderId: "612268120003",
  appId: "1:612268120003:web:5d871f80687c6baedc0f76",
  measurementId: "G-JK940BT12Y"
};

const $ = id => document.getElementById(id);

let db;
let auth;
let storage;
let confirmation;
let recaptcha;
let unsub;
let user = null;
let guest = false;
let recorder;
let chunks = [];

function say(message) {
  $("status").textContent = message;
}

function profile() {
  const name =
    localStorage.getItem("sawaName") || "مستخدم سوا";

  $("name").textContent = name;

  $("phoneLabel").textContent =
    user?.phoneNumber ||
    (guest ? "وضع التجربة" : "ملفك الشخصي");

  $("avatar").textContent = name[0] || "س";
}

function enter() {
  $("login").classList.add("hidden");
  $("main").classList.remove("hidden");

  profile();
  listen();
}

function draw(data) {
  const element = document.createElement("div");
  element.className = "msg";

  const meta = document.createElement("div");
  meta.className = "meta";

  meta.textContent =
    (data.name || "مستخدم") +
    (data.phone ? " · " + data.phone : "");

  element.append(meta);

  if (data.text) {
    const paragraph = document.createElement("div");
    paragraph.textContent = data.text;
    element.append(paragraph);
  }

  if (data.url) {
    if ((data.type || "").startsWith("image/")) {
      const image = document.createElement("img");
      image.src = data.url;
      image.alt = "صورة";
      element.append(image);

    } else if ((data.type || "").startsWith("audio/")) {
      const audio = document.createElement("audio");
      audio.controls = true;
      audio.src = data.url;
      element.append(audio);

    } else {
      const link = document.createElement("a");
      link.href = data.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = data.filename || "فتح الملف";
      element.append(link);
    }
  }

  return element;
}

function listen() {
  if (!db) return;

  if (unsub) unsub();

  const messagesQuery = query(
    collection(db, "messages"),
    orderBy("timestamp", "asc"),
    limit(200)
  );

  unsub = onSnapshot(
    messagesQuery,

    snapshot => {
      const chat = $("chat");
      chat.replaceChildren();

      snapshot.forEach(document => {
        chat.append(draw(document.data()));
      });

      chat.scrollTop = chat.scrollHeight;
    },

    error => {
      say("تعذر تحميل الرسائل: " + error.message);
    }
  );
}

async function send(data) {
  if (!db) {
    say("Firebase غير متصل.");
    return;
  }

  try {
    await addDoc(collection(db, "messages"), {
      ...data,
      name: localStorage.getItem("sawaName") || "مستخدم سوا",
      phone: user?.phoneNumber || "",
      timestamp: serverTimestamp()
    });

    say("تم الإرسال");

  } catch (error) {
    say("تعذر الإرسال: " + error.message);
  }
}

$("send").onclick = async () => {
  const text = $("message").value.trim();

  if (!text) return;

  $("send").disabled = true;

  await send({ text });

  $("message").value = "";
  $("send").disabled = false;
};

$("message").onkeydown = event => {
  if (event.key === "Enter") {
    $("send").click();
  }
};

function editProfile() {
  const current =
    localStorage.getItem("sawaName") || "";

  const name = prompt("اكتب اسمك:", current);

  if (name && name.trim()) {
    localStorage.setItem(
      "sawaName",
      name.trim().slice(0, 40)
    );

    profile();
    say("تم تحديث الاسم على هذا الجهاز.");
  }
}

$("profile").onclick = editProfile;
$("edit").onclick = editProfile;

$("search").oninput = () => {
  const term = $("search").value.toLowerCase();

  [...$("chat").children].forEach(element => {
    element.classList.toggle(
      "hidden",
      term && !element.textContent.toLowerCase().includes(term)
    );
  });
};

$("guest").onclick = () => {
  guest = true;
  enter();
  say("وضع تجربة بدون تسجيل");
};

$("sendCode").onclick = async () => {
  try {
    const phone = $("phone").value.trim();

    if (!phone.startsWith("+")) {
      throw Error(
        "اكتب الرقم مع مفتاح الدولة، مثل +90XXXXXXXXXX"
      );
    }

    if (!recaptcha) {
      recaptcha = new RecaptchaVerifier(
        auth,
        "recaptcha-container",
        { size: "normal" }
      );
    }

    confirmation = await signInWithPhoneNumber(
      auth,
      phone,
      recaptcha
    );

    $("codeArea").classList.remove("hidden");

    say("أدخل رمز SMS الذي وصلك.");

  } catch (error) {
    say("تعذر إرسال الرمز: " + error.message);

    try {
      recaptcha?.clear();
    } catch {}

    recaptcha = null;
  }
};

$("verify").onclick = async () => {
  try {
    if (!confirmation) {
      throw Error("اطلب رمز التحقق أولاً.");
    }

    await confirmation.confirm(
      $("code").value.trim()
    );

    say("تم التحقق من رقم الهاتف.");

  } catch (error) {
    say("تعذر التحقق من الرمز: " + error.message);
  }
};

$("logout").onclick = async () => {
  try {
    if (user) {
      await signOut(auth);
    } else {
      guest = false;

      if (unsub) {
        unsub();
        unsub = null;
      }

      $("main").classList.add("hidden");
      $("login").classList.remove("hidden");
    }

  } catch (error) {
    say("تعذر تسجيل الخروج: " + error.message);
  }
};

$("attach").onclick = () => {
  $("file").click();
};

$("file").onchange = async event => {
  const file = event.target.files[0];

  if (!file) return;

  if (file.size > 10 * 1024 * 1024) {
    say("الحد الأقصى للملف 10 ميغابايت.");
    event.target.value = "";
    return;
  }

  try {
    if (!storage) {
      throw Error("Firebase Storage غير جاهز.");
    }

    say("جارٍ رفع الملف...");

    const safeName = file.name.replace(
      /[^\w.\-]/g,
      "_"
    );

    const storageRef = ref(
      storage,
      "chatUploads/" + Date.now() + "_" + safeName
    );

    await uploadBytes(storageRef, file);

    const url = await getDownloadURL(storageRef);

    await send({
      url,
      type: file.type,
      filename: file.name
    });

  } catch (error) {
    say("فشل رفع الملف: " + error.message);

  } finally {
    event.target.value = "";
  }
};

$("record").onclick = async () => {
  try {
    if (recorder?.state === "recording") {
      recorder.stop();
      $("record").textContent = "🎙️";
      return;
    }

    if (!navigator.mediaDevices?.getUserMedia) {
      throw Error(
        "الميكروفون غير متاح. افتح الموقع عبر HTTPS."
      );
    }

    const stream =
      await navigator.mediaDevices.getUserMedia({
        audio: true
      });

    chunks = [];

    recorder = new MediaRecorder(stream);

    recorder.ondataavailable = event => {
      if (event.data.size) {
        chunks.push(event.data);
      }
    };

    recorder.onstop = async () => {
      stream.getTracks().forEach(track => {
        track.stop();
      });

      const blob = new Blob(chunks, {
        type: recorder.mimeType || "audio/webm"
      });

      const file = new File(
        [blob],
        "voice-" + Date.now() + ".webm",
        {
          type: blob.type
        }
      );

      try {
        say("جارٍ رفع التسجيل الصوتي...");

        const storageRef = ref(
          storage,
          "chatUploads/" + file.name
        );

        await uploadBytes(storageRef, file);

        const url = await getDownloadURL(storageRef);

        await send({
          url,
          type: file.type,
          filename: "رسالة صوتية"
        });

        $("recordStatus").textContent =
          "انتهى التسجيل.";

      } catch (error) {
        say("فشل رفع الصوت: " + error.message);
      }
    };

    recorder.start();

    $("record").textContent = "⏹ إيقاف";

    $("recordStatus").textContent =
      "يسجل الآن. اضغط إيقاف عند الانتهاء.";

  } catch (error) {
    say("تعذر التسجيل: " + error.message);
  }
};

try {
  const app = initializeApp(config);

  db = getFirestore(app);
  auth = getAuth(app);
  storage = getStorage(app);

  onAuthStateChanged(auth, currentUser => {
    user = currentUser;

    if (currentUser) {
      guest = false;
      enter();

    } else if (!guest) {
      if (unsub) {
        unsub();
        unsub = null;
      }

      $("main").classList.add("hidden");
      $("login").classList.remove("hidden");
    }
  });

} catch (error) {
  say("خطأ في Firebase: " + error.message);
}

</script>

</body>
</html>
